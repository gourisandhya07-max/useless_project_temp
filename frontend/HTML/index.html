<section class="auth-section">

    <div class="auth-card">

        <h2>
            🐶 Start with your dog
        </h2>

        <p>
            Create an account to save
            your potty history.
        </p>


        <input
            id="email"
            type="email"
            placeholder="Email"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <div class="auth-buttons">

            <button
                id="signupBtn"
                class="btn primary"
            >
                Create Account
            </button>


            <button
                id="loginBtn"
                class="btn secondary"
            >
                Login
            </button>

        </div>


        <p id="authMessage"></p>

    </div>

</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="JS/supabase-config.js"></script>

<script src="JS/auth.js"></script>
