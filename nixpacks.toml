# Nixpacks build configuration for Railway
[phases.setup]
nixPkgs = ["python311", "ffmpeg", "libGL", "glib"]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    "pip install -r backend/requirements.txt"
]

[start]
cmd = "if [ -d backend ]; then cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}; else uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}; fi"
